name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: golib-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Select modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      count: ${{ steps.selection.outputs.count }}
      kafka_arm64: ${{ steps.selection.outputs.kafka_arm64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Select changed modules and reverse dependants
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            matrix="$(go run ./cmd/golib select --changed "${BASE_SHA}" --format matrix)"
            changed_matrix="${matrix}"
          else
            matrix="$(go run ./cmd/golib select --all --format matrix)"
            changed_matrix="${matrix}"
            if [[ "${EVENT_NAME}" == "push" &&
                  "${PUSH_BASE_SHA}" =~ ^[0-9a-f]{40}$ &&
                  "${PUSH_BASE_SHA}" != "0000000000000000000000000000000000000000" ]] &&
                git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null; then
              changed_matrix="$(go run ./cmd/golib select --changed "${PUSH_BASE_SHA}" --format matrix)"
            fi
          fi
          count="$(jq 'length' <<<"${matrix}")"
          [[ "${count}" -gt 0 ]] || {
            echo 'module selection is empty' >&2
            exit 1
          }
          {
            echo "matrix=${matrix}"
            echo "count=${count}"
            echo "kafka_arm64=$(jq -r 'any(.[]; .directory == "pkg/kafka")' <<<"${changed_matrix}")"
          } >>"${GITHUB_OUTPUT}"

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Validate repository contract
        run: make repository-check

  quality:
    name: Module / ${{ matrix.directory }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Set up ripgrep
        env:
          RIPGREP_VERSION: 15.2.0
          RIPGREP_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/ripgrep.tar.gz"
          root="${RUNNER_TEMP}/ripgrep"
          curl --fail --silent --show-error --location \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${RIPGREP_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${root}"
          tar --extract --gzip --file "${archive}" --directory "${root}" \
            --strip-components 1
          echo "${root}" >> "${GITHUB_PATH}"
          "${root}/rg" --version | grep -Eq "^ripgrep ${RIPGREP_VERSION}( |$)"

      - name: Set up Node for browser, Test262, and documentation gates
        if: matrix.directory == '.' || matrix.directory == 'pkg/ecma-regexp' || matrix.directory == 'pkg/queue-control-plane'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.4.1'
          package-manager-cache: false

      - name: Set up Deno for ECMAScript differential gates
        if: matrix.directory == 'pkg/ecma-regexp'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.4'
          cache: false

      - name: Set up CLI shell runtime
        if: matrix.directory == 'pkg/cli'
        env:
          ZSH_DEB_SHA256: bd5cc8dd3a01a6db38c0a815d75202c356a9c7f378674ba7bed9bc86dcba8af0
        run: |
          archive="${RUNNER_TEMP}/zsh_5.9-6ubuntu2_amd64.deb"
          root="${RUNNER_TEMP}/zsh-runtime"
          curl --fail --silent --show-error --location \
            'https://archive.ubuntu.com/ubuntu/pool/main/z/zsh/zsh_5.9-6ubuntu2_amd64.deb' \
            --output "${archive}"
          printf '%s  %s\n' "${ZSH_DEB_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${root}"
          dpkg-deb --extract "${archive}" "${root}"
          echo "${root}/bin" >> "${GITHUB_PATH}"
          "${root}/bin/zsh" --version | grep -Eq '^zsh 5\.9 '

      - name: Run strict module contract
        run: ./scripts/run-modules.sh check --modules '${{ matrix.directory }}'

      - name: Upload attributable evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-${{ matrix.artifact }}
          path: ${{ matrix.directory == '.' && '.artifacts' || format('.artifacts/{0}', matrix.directory) }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  codeql:
    name: CodeQL
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: go
          queries: security-extended,security-and-quality

      - name: Build every Go module
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE}/go.work"
          go run ./cmd/golib select --all | while IFS= read -r module; do
            [[ -n "${module}" ]] || continue
            if [[ "$(jq -r --arg directory "${module}" '.modules[] | select(.directory == $directory) | (.packages | length)' modules.json)" -gt 0 ]]; then
              tags="$(jq -r --arg directory "${module}" '.modules[] | select(.directory == $directory) | .build_tags[]?' modules.json)"
              expected="$(jq -r --arg directory "${module}" '.modules[] | select(.directory == $directory) | .packages[] | select(.build_required == true) | .import_path' modules.json | LC_ALL=C sort)"
              [[ -n "${expected}" ]] || {
                echo "no build-required packages cataloged for ${module}" >&2
                exit 1
              }
              slug="${module//\//-}"
              [[ "${slug}" != "." ]] || slug=root
              output="${RUNNER_TEMP}/codeql-build/${slug}"
              mkdir -p "${output}"
              resolved="$(
                {
                  (cd "${module}" && GOWORK="${workspace}" go list -f '{{if or .GoFiles .CgoFiles}}{{.ImportPath}}{{end}}' ./...)
                  while IFS= read -r tag; do
                    [[ -n "${tag}" ]] || continue
                    (cd "${module}" && GOWORK="${workspace}" go list -tags="${tag}" -f '{{if or .GoFiles .CgoFiles}}{{.ImportPath}}{{end}}' ./...)
                  done <<<"${tags}"
                } | sed '/^$/d' | LC_ALL=C sort -u
              )"
              if [[ "${resolved}" != "${expected}" ]]; then
                printf 'CodeQL package mismatch for %s\nexpected:\n%s\nresolved:\n%s\n' \
                  "${module}" "${expected}" "${resolved}" >&2
                exit 1
              fi
              package_index=0
              while IFS= read -r package; do
                [[ -n "${package}" ]] || continue
                package_tags="$(jq -r --arg directory "${module}" --arg package "${package}" '.modules[] | select(.directory == $directory) | .packages[] | select(.import_path == $package) | .build_tags[]?' modules.json)"
                if [[ "${module}" == "pkg/service/benchmarks/platform" && -n "${package_tags}" ]]; then
                  # These tags select mutually exclusive process entry points for
                  # one import path. Trace one canonical entry point; the shared
                  # workload containing every benchmark mode is compiled with it.
                  package_tags="benchmark_disabled"
                fi
                if [[ -n "${package_tags}" ]]; then
                  variant_index=0
                  while IFS= read -r tag; do
                    [[ -n "${tag}" ]] || continue
                    target="${output}/package-${package_index}-variant-${variant_index}"
                    (cd "${module}" && GOWORK="${workspace}" go build -tags="${tag}" -o "${target}" "${package}")
                    variant_index=$((variant_index + 1))
                  done <<<"${package_tags}"
                else
                  target="${output}/package-${package_index}-default"
                  (cd "${module}" && GOWORK="${workspace}" go build -o "${target}" "${package}")
                fi
                package_index=$((package_index + 1))
              done <<<"${resolved}"
            fi
          done

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  kafka-arm64:
    name: Kafka / Linux arm64
    needs: prepare
    if: needs.prepare.outputs.kafka_arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false

      - name: Run Kafka contract tests on Linux arm64
        run: ./scripts/run-modules.sh test --modules 'pkg/kafka'

      - name: Upload attributable evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidence-pkg-kafka-linux-arm64
          path: .artifacts/pkg/kafka
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  required:
    name: Required
    if: always()
    needs: [prepare, repository-contract, quality, codeql, kafka-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every expected result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REPOSITORY_CONTRACT_RESULT: ${{ needs.repository-contract.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          KAFKA_ARM64_REQUIRED: ${{ needs.prepare.outputs.kafka_arm64 }}
          KAFKA_ARM64_RESULT: ${{ needs.kafka-arm64.result }}
          MODULE_COUNT: ${{ needs.prepare.outputs.count }}
        run: |
          set -euo pipefail
          [[ "${PREPARE_RESULT}" == success ]]
          [[ "${REPOSITORY_CONTRACT_RESULT}" == success ]]
          [[ "${QUALITY_RESULT}" == success ]]
          [[ "${CODEQL_RESULT}" == success ]]
          if [[ "${KAFKA_ARM64_REQUIRED}" == true ]]; then
            [[ "${KAFKA_ARM64_RESULT}" == success ]]
          else
            [[ "${KAFKA_ARM64_RESULT}" == skipped ]]
          fi
          [[ "${MODULE_COUNT}" =~ ^[1-9][0-9]*$ ]]
          printf 'all %s selected modules and repository gates passed\n' "${MODULE_COUNT}"
